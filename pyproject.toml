[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eu-audit-mcp"
version = "0.1.1"
description = "Tamper-evident audit trail MCP server for EU AI Act and GDPR compliance"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "fastmcp>=2.2",
    "aiosqlite>=0.19",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "cryptography>=42.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
eu-audit-mcp = "eu_audit_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "strict"
